<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Newsroom - Multi-Agent System</title>
    <style>
        body { background: #0f172a; color: #f8fafc; font-family: system-ui, sans-serif; padding: 2rem; }
        .container { max-width: 900px; margin: auto; }
        input { width: 70%; padding: 12px; border-radius: 6px; border: 1px solid #334155; background: #1e293b; color: white; }
        button { padding: 12px 24px; border-radius: 6px; border: none; background: #3b82f6; color: white; font-weight: bold; cursor: pointer; }
        .tabs { display: flex; gap: 10px; margin-top: 20px; }
        .tab-btn { padding: 10px 20px; background: #1e293b; border: 1px solid #334155; color: #94a3b8; cursor: pointer; border-radius: 6px 6px 0 0; }
        .tab-btn.active { background: #334155; color: white; border-bottom: 2px solid #3b82f6; }
        .content-box { background: #1e293b; border: 1px solid #334155; padding: 20px; border-radius: 0 6px 6px 6px; min-height: 200px; white-space: pre-wrap; }
        #status { color: #38bdf8; margin-top: 10px; font-weight: 500; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📰 AI Newsroom (Multi-Agent Relay)</h1>
        <p style="color: #94a3b8;">Backboard.io Stateful Agent Architecture</p>
        <div style="display: flex; gap: 10px;">
            <input type="text" id="topic" value="The Rise of AI Agents">
            <button onclick="runPipeline()">Run Newsroom</button>
        </div>
        <div id="status"></div>
        
        <div class="tabs">
            <button class="tab-btn active" onclick="showTab('facts', this)">1. Researcher Facts</button>
            <button class="tab-btn" onclick="showTab('draft', this)">2. First Draft</button>
            <button class="tab-btn" onclick="showTab('critique', this)">3. Editor Notes</button>
            <button class="tab-btn" onclick="showTab('final', this)">4. Final Article</button>
        </div>
        <div id="content" class="content-box">Submit a topic to initiate the agent relay...</div>
    </div>

    <script>
        let results = {};
        async function runPipeline() {
            const topic = document.getElementById('topic').value;
            const status = document.getElementById('status');
            status.innerText = "🔄 Agents working: Researcher -> Writer -> Editor -> Revision...";
            
            const res = await fetch('/api/report', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({topic})
            });
            results = await res.json();
            status.innerText = "✅ Multi-agent execution completed!";
            showTab('facts', document.querySelectorAll('.tab-btn')[0]);
        }

        function showTab(key, btn) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            if(btn) btn.classList.add('active');
            document.getElementById('content').innerText = results[key] || "No data yet.";
        }
    </script>
</body>
</html>
